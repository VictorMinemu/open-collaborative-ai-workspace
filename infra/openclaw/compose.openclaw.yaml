# OpenClaw cell (one per organization) — snippet for the integrator to merge into compose.yaml.
#
# Trust boundary: the cell only talks to the Agent Channel API (http://api:4000/agent-channel/v1)
# with OCW_CELL_TOKEN, and to the model providers it receives from GET /cell. The OpenClaw
# gateway/admin port (18789) binds loopback INSIDE the container and is never published.
#
# Model provider keys are NOT configured here: admins enter them in Settings › Models; the API hands
# them to the cell over the authenticated Agent Channel; the plugin keeps them in process env only.
#
# .env (written by `pnpm setup:env`, never committed):
#   OCW_CELL_TOKEN=<>= 32 random chars>   # same value the api service verifies
services:
  openclaw:
    build:
      context: .
      dockerfile: infra/openclaw/Dockerfile
    image: ocw-openclaw:local
    restart: unless-stopped
    environment:
      OCW_API_URL: http://api:4000
      OCW_CELL_TOKEN_FILE: /run/secrets/ocw_cell_token
      # The gateway peaks around 1.1-1.2 GB RSS during a turn. 512 MB V8 heap: 256 was enough with the
      # fake provider but hit a V8 heap OOM once the bundled anthropic provider plugin auto-loaded.
      # Without any cap the cell was VM-OOM-killed on a host with ~1.3 GB Docker headroom.
      NODE_OPTIONS: ${OCW_CELL_NODE_OPTIONS:---max-old-space-size=512}
    secrets:
      - ocw_cell_token
    volumes:
      # Named volume only (SQLite locking): sessions, plugin cursor, rendered config.
      - openclaw-state:/home/node/.openclaw
    # No `ports:` on purpose.
    healthcheck:
      test: ["CMD", "node", "dist/docker-healthcheck.js"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 6
    depends_on:
      api:
        condition: service_healthy

secrets:
  ocw_cell_token:
    environment: OCW_CELL_TOKEN

volumes:
  openclaw-state:
