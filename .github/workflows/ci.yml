name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify (lint, typecheck, unit + integration)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Enable pnpm (packageManager pin)
        run: corepack enable && pnpm --version
      - run: pnpm install --frozen-lockfile
      # Integration tests start real PostgreSQL 18 / Redis 8 containers (testcontainers).
      - run: pnpm verify
      - name: Package suites (daemon, desktop)
        run: |
          pnpm --filter @ocw/local-runtime test
          pnpm --filter @ocw/desktop test

  e2e:
    name: e2e (Playwright, desktop + mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    env:
      # Bots use the deterministic mock model; CI never receives a metered model key.
      OCW_MODEL_PROVIDER: mock
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Environment and database
        run: |
          pnpm setup:env
          docker compose up -d --wait postgres redis
          pnpm db:migrate
      - name: Start API and web
        run: |
          (cd apps/api && nohup node --env-file-if-exists=../../.env --import tsx src/main.ts > ../../api.log 2>&1 &)
          (cd apps/web && pnpm build && nohup node --env-file-if-exists=../../.env ./node_modules/next/dist/bin/next start -p 3000 > ../../web.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf localhost:4000/health && curl -sf -o /dev/null localhost:3000/login && break; sleep 2; done
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - name: Logs and report on failure
        if: failure()
        run: tail -n 200 api.log web.log || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  images:
    name: docker images (api, web)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f apps/api/Dockerfile -t ocw-api:ci .
      - run: docker build -f apps/web/Dockerfile -t ocw-web:ci .
