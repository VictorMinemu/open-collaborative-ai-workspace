# Woodpecker port of the `cell-smoke` job in .github/workflows/ci.yml: real OpenClaw cell (image built here from
# infra/openclaw/Dockerfile) + the working-tree plugin + fake model + fake Agent Channel API on an egress-less
# network. The smoke bind-mounts files from the checkout and from `mktemp -d`, so both live under /home/ocw-ci,
# which exists at the same path on the dind daemon (see verify.yaml).
when:
  - event: [push, pull_request, manual]

variables:
  - &docker_sock /var/run/docker.sock:/var/run/docker.sock
  - &shared /home/ocw-ci:/home/ocw-ci
  - &env
    W: /home/ocw-ci/ws/cell-smoke
    PNPM_STORE: /home/ocw-ci/cache/pnpm-store
    TMPDIR: /home/ocw-ci/tmp/cell-smoke

steps:
  - name: ci-image
    image: docker:29.8.2-cli
    volumes: [*docker_sock]
    commands:
      - sh infra/ci/build-image.sh

  - name: install
    image: ocw-ci:local
    pull: false
    volumes: [*docker_sock, *shared]
    environment: *env
    commands:
      - rm -rf "$${W}" "$${TMPDIR}" && mkdir -p "$${W}" "$${TMPDIR}" && cp -a . "$${W}/"
      - cd "$${W}" && pnpm install --frozen-lockfile --store-dir "$${PNPM_STORE}"
      # Stdio MCP sandbox dependencies (locked, no lifecycle scripts).
      - npm ci --prefix infra/mcp-sandbox --ignore-scripts --no-audit --no-fund

  - name: unit-tests
    image: ocw-ci:local
    pull: false
    volumes: [*shared]
    environment: *env
    commands:
      - cd "$${W}" && node --test 'infra/**/*.test.mjs'

  - name: smoke
    image: ocw-ci:local
    pull: false
    volumes: [*docker_sock, *shared]
    environment: *env
    commands:
      - cd "$${W}"
      # A cancelled run skips its cleanup step: remove anything it left behind first.
      - sh infra/ci/smoke-reset.sh
      - pnpm --filter @ocw/openclaw-channel build
      - SMOKE_BUILD=1 bash infra/openclaw/test/run-container-smoke.sh

  - name: cleanup
    image: ocw-ci:local
    pull: false
    volumes: [*docker_sock, *shared]
    environment: *env
    commands:
      # The smoke removes its own containers, volume and networks on exit; this covers a killed step.
      - sh infra/ci/smoke-reset.sh
      - rm -rf "$${W}" "$${TMPDIR}"
    when:
      status: [success, failure]
