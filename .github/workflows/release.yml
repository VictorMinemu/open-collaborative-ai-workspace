# Releases. A vX.Y.Z tag builds the desktop app on macOS, Windows and Linux runners and publishes a GitHub release with
# the apps, the server installer and their SHA-256 checksums; the notes come from docs/releases/<tag>.md (else GitHub's
# generated notes). A tag with a suffix (v0.2.0-rc.1) is published as a pre-release, which `ocw upgrade` never picks by
# itself. The release stays a draft until every build is uploaded and SHA256SUMS covers them all.
# Pull requests touching the desktop app, the daemon or this file build the apps too (nothing is uploaded).
# No build is signed yet: macOS gets an ad-hoc signature (no Developer ID, no notarization) and Windows none (the
# release notes say how to open them). workflow_dispatch rebuilds and re-uploads an existing tag.
name: release

on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/local-runtime/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing release tag to rebuild and publish (vX.Y.Z)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}

jobs:
  # Opens the release as a draft (or reuses an existing one) and uploads the server installer.
  prepare:
    name: draft release
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check the tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "not a release tag: $TAG"; exit 1; }
      # Pinned to commit SHAs: these jobs can publish releases.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          sparse-checkout: |
            docs/releases
            scripts/install.sh
          sparse-checkout-cone-mode: false
      - name: Draft the release and upload install.sh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            args=(--draft --verify-tag --title "OCW $TAG")
            if [[ -f "docs/releases/$TAG.md" ]]; then args+=(--notes-file "docs/releases/$TAG.md"); else args+=(--generate-notes); fi
            if [[ "$TAG" == *-* ]]; then args+=(--prerelease); fi
            gh release create "$TAG" "${args[@]}"
          fi
          gh release upload "$TAG" scripts/install.sh --clobber

  desktop:
    name: desktop app (${{ matrix.name }})
    needs: prepare
    # Pull requests skip `prepare` and only build.
    if: ${{ !cancelled() && needs.prepare.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS arm64, os: macos-15, platform: macos-arm64 }
          - { name: Windows x64, os: windows-2025, platform: windows-x64 }
          - { name: Linux x64, os: ubuntu-24.04, platform: linux-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write # the upload step only; pull requests from forks get a read-only token anyway
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG && format('refs/tags/{0}', env.TAG) || github.ref }}
          # .planning/ is most of the tree and no build reads it.
          sparse-checkout: |
            /*
            !/.planning/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: pnpm (corepack)
        run: corepack enable && pnpm --version
      - run: pnpm install --frozen-lockfile
      - name: App version from the tag
        if: env.TAG != ''
        working-directory: apps/desktop
        run: npm pkg set version="${TAG#v}"
      - name: Build the app
        run: pnpm --filter @ocw/desktop package
      - name: Check that the packaged daemon runs
        run: node apps/desktop/scripts/check-package.mjs
      - name: Collect the release files
        run: |
          set -euo pipefail
          mkdir -p out
          name="OCW-${TAG:-pr}"
          cd apps/desktop/release
          case "${{ matrix.platform }}" in
            macos-arm64) cp *.dmg "../../../out/$name-macos-arm64.dmg" ;;
            windows-x64) cp "OCW Setup "*.exe "../../../out/$name-windows-x64-setup.exe" ;;
            linux-x64)
              cp *.AppImage "../../../out/$name-linux-x86_64.AppImage"
              cp *.deb "../../../out/$name-linux-amd64.deb"
              ;;
          esac
          ls -l ../../../out
      # No workflow artifact: on a public repository it would be a second, unreviewed download channel. A pull request
      # only proves the apps build and their daemon runs; a tag publishes them through the draft release.
      - name: Upload to the draft release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" out/* --clobber

  # Checksums over everything uploaded, then the draft goes public.
  publish:
    name: publish release
    needs: desktop
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: SHA256SUMS and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir files && cd files
          gh release download "$TAG" --pattern 'OCW-*' --pattern 'install.sh'
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber
          if [[ "$TAG" == *-* ]]; then
            gh release edit "$TAG" --draft=false --prerelease
          else
            gh release edit "$TAG" --draft=false --latest
          fi
