# Woodpecker port of the `images` job in .github/workflows/ci.yml: the shipped images build. The build context is
# streamed to the dind daemon, so the regular Woodpecker workspace is enough here. It publishes nothing: the `:ci` tags
# stay on the dind (nothing reads them), so it is safe next to any other workflow and needs no slot.
# Pull requests, pushes to main, and manual runs (an open PR runs once, not once per event).
when:
  - event: [pull_request, manual]
  - event: push
    branch: main

variables:
  - &docker_sock /var/run/docker.sock:/var/run/docker.sock

steps:
  - name: api
    image: docker:29.8.2-cli
    volumes: [*docker_sock]
    commands:
      - docker build -f apps/api/Dockerfile -t ocw-api:ci .

  - name: web
    image: docker:29.8.2-cli
    volumes: [*docker_sock]
    commands:
      - docker build -f apps/web/Dockerfile -t ocw-web:ci .

  # The shipped cell image with the bundled search plugins (pinned + sha512-checked at build time).
  - name: openclaw
    image: docker:29.8.2-cli
    volumes: [*docker_sock]
    commands:
      - docker build -f infra/openclaw/Dockerfile -t ocw-openclaw:ci .

  # Bot sandboxes (07.8-24): the broker and the three images it runs, as the `sandbox` compose profile builds them.
  - name: sandboxd
    image: docker:29.8.2-cli
    volumes: [*docker_sock]
    commands:
      - docker build -f infra/sandbox/sandboxd/Dockerfile -t ocw-sandboxd:ci .

  - name: sandbox-sbx
    image: docker:29.8.2-cli
    volumes: [*docker_sock]
    commands:
      - docker build -t ocw-sandbox-sbx:ci infra/sandbox/sbx

  - name: sandbox-brw
    image: docker:29.8.2-cli
    volumes: [*docker_sock]
    commands:
      - docker build -t ocw-sandbox-brw:ci infra/sandbox/browser

  - name: sandbox-egress
    image: docker:29.8.2-cli
    volumes: [*docker_sock]
    commands:
      - docker build -f infra/sandbox/egress/Dockerfile -t ocw-sandbox-egress:ci .
