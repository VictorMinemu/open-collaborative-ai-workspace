# Open Collaborative AI Workspace — self-hosted stack (minimal profile).
#   pnpm ocw setup                          # once: writes .env with random secrets (never printed)
#   docker compose up -d --build --wait
# Web: http://localhost:3000   API: http://localhost:4000 (/docs for OpenAPI)   Attachments (S3): http://localhost:3900
# Images are tagged ocw-<svc>:${OCW_IMAGE_TAG:-local}; api and web publish on ${OCW_PUBLISH_ADDRESS:-0.0.0.0} (set it to
# 127.0.0.1 behind a reverse proxy). Optional profiles live in included files and stay off until named in
# COMPOSE_PROFILES: proxy (Caddy), observability (OTel Collector, Prometheus, Grafana, Loki, Tempo), vault (OpenBao),
# pii (Presidio sensitive-data scan for memory proposals). Profiles defined here: search, mcp-sandbox and sandbox (bot
# sandboxes and browser, see sandboxd below).
# Upgrading an install whose .env predates attachments: `pnpm setup:env --add-missing` appends the Garage/S3 keys
# (it never rotates existing values), then `docker compose up -d`. Without them Garage does not start and the API
# reports attachments as disabled; nothing else is affected (infra/garage/README.md).
include:
  - infra/caddy/compose.yaml
  - infra/observability/compose.yaml
  - infra/openbao/compose.yaml
  - infra/presidio/compose.yaml

x-db-urls: &db-urls
  DATABASE_URL: postgres://ocw_app:${OCW_DB_APP_PASSWORD:?Set OCW_DB_APP_PASSWORD in .env (run pnpm setup:env)}@postgres:5432/ocw
  AUTH_DATABASE_URL: postgres://ocw_auth:${OCW_DB_AUTH_PASSWORD:?Set OCW_DB_AUTH_PASSWORD in .env (run pnpm setup:env)}@postgres:5432/ocw
  REDIS_URL: redis://redis:6379

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ocw
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (run pnpm setup:env)}
    volumes:
      # postgres:18 keeps PGDATA under /var/lib/postgresql/18/docker; mount the parent (not .../data).
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:${OCW_POSTGRES_PORT:-54329}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ocw"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OCW_REDIS_PORT:-63799}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for chat attachments (Garage, ADR-0015). One process, no init container:
  # `--single-node --default-bucket` creates the layout, the access key and the private bucket on first start from
  # the GARAGE_DEFAULT_* values below (the same key pair the API uses). No `:?` guards here (P-10): compose
  # interpolates every service, so a guard would break `docker compose up postgres redis` for an .env without these
  # keys. No healthcheck: the image has no shell or probe tool; the API retries until the bucket answers. The S3 port
  # is published on loopback only, for presigned browser URLs (a reverse proxy fronts it from Phase 7).
  garage:
    image: dxflrs/garage:v2.4.1
    restart: unless-stopped
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-}
      GARAGE_DEFAULT_ACCESS_KEY: ${OCW_S3_ACCESS_KEY_ID:-}
      GARAGE_DEFAULT_SECRET_KEY: ${OCW_S3_SECRET_ACCESS_KEY:-}
      GARAGE_DEFAULT_BUCKET: ${OCW_S3_BUCKET:-ocw-attachments}
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    ports:
      - "127.0.0.1:${OCW_S3_PORT:-3900}:3900"

  # One-shot: bootstrap roles (superuser), run migrations + FORCE RLS step (ocw_migrator), then exit 0.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: ocw-api:${OCW_IMAGE_TAG:-local}
    working_dir: /app/packages/db
    command: ["node", "--import", "tsx", "src/migrate-cli.ts"]
    restart: "no"
    environment:
      MIGRATE_SUPERUSER_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/ocw
      MIGRATOR_DATABASE_URL: postgres://ocw_migrator:${OCW_DB_MIGRATOR_PASSWORD:?Set OCW_DB_MIGRATOR_PASSWORD in .env (run pnpm setup:env)}@postgres:5432/ocw
      OCW_DB_MIGRATOR_PASSWORD: ${OCW_DB_MIGRATOR_PASSWORD}
      OCW_DB_APP_PASSWORD: ${OCW_DB_APP_PASSWORD}
      OCW_DB_AUTH_PASSWORD: ${OCW_DB_AUTH_PASSWORD}
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ocw-api:${OCW_IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      <<: *db-urls
      NODE_ENV: production
      PORT: "4000"
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env (run pnpm setup:env)}
      OCW_SETUP_TOKEN: ${OCW_SETUP_TOKEN:?Set OCW_SETUP_TOKEN in .env (run pnpm setup:env)}
      OCW_ENCRYPTION_KEY: ${OCW_ENCRYPTION_KEY:?Set OCW_ENCRYPTION_KEY in .env (run pnpm setup:env)}
      OCW_PUBLIC_WEB_URL: ${OCW_PUBLIC_WEB_URL:-http://localhost:3000}
      OCW_PUBLIC_API_URL: ${OCW_PUBLIC_API_URL:-http://localhost:4000}
      OCW_TRUSTED_ORIGINS: ${OCW_TRUSTED_ORIGINS:-}
      # Bots: bearer token shared with the openclaw cell (Agent Channel API scope only).
      OCW_CELL_TOKEN: ${OCW_CELL_TOKEN:?Set OCW_CELL_TOKEN in .env (run pnpm setup:env)}
      OCW_MODEL_PROVIDER: ${OCW_MODEL_PROVIDER:-}
      OCW_MOCK_MODEL_BASE_URL: ${OCW_MOCK_MODEL_BASE_URL:-http://fake-model:18999/v1}
      # Web search for bots (D-09): DuckDuckGo is bundled in the cell; SearXNG needs the `search` profile.
      OCW_SEARXNG_URL: ${OCW_SEARXNG_URL:-}
      OCW_BUNDLED_PLUGINS: ${OCW_BUNDLED_PLUGINS:-}
      # OpenClaw Marketplace (D-14): the ClawHub origin the API proxies and the cell downloads approved artifacts from.
      # Keep it identical on api and openclaw (the cell refuses artifact URLs of any other origin).
      OCW_CLAWHUB_URL: ${OCW_CLAWHUB_URL:-https://clawhub.ai}
      # Optional stdio MCP sandbox (profile `mcp-sandbox`, D-13): the sidecar URL as seen from the cell and the vetted
      # servers baked into its image (infra/mcp-sandbox/servers.json ids). Empty = admins can only add remote servers.
      OCW_MCP_SANDBOX_URL: ${OCW_MCP_SANDBOX_URL:-}
      OCW_MCP_SANDBOX_SERVERS: ${OCW_MCP_SANDBOX_SERVERS:-}
      # Optional password reset e-mails; without SMTP admins issue reset links.
      OCW_SMTP_URL: ${OCW_SMTP_URL:-}
      OCW_MAIL_FROM: ${OCW_MAIL_FROM:-}
      # Chat attachments (ADR-0015): server calls go to garage on the compose network; browser URLs are signed for
      # OCW_S3_PUBLIC_URL. An empty key id or secret disables attachments instead of failing the boot.
      OCW_S3_ENDPOINT: http://garage:3900
      OCW_S3_PUBLIC_URL: ${OCW_S3_PUBLIC_URL:-http://localhost:3900}
      OCW_S3_BUCKET: ${OCW_S3_BUCKET:-ocw-attachments}
      OCW_S3_REGION: ${OCW_S3_REGION:-garage}
      OCW_S3_ACCESS_KEY_ID: ${OCW_S3_ACCESS_KEY_ID:-}
      OCW_S3_SECRET_ACCESS_KEY: ${OCW_S3_SECRET_ACCESS_KEY:-}
      OCW_ATTACHMENT_MAX_BYTES: ${OCW_ATTACHMENT_MAX_BYTES:-26214400}
      # Behind the `proxy` profile (Caddy) set OCW_TRUST_PROXY=1 and OCW_PUBLISH_ADDRESS=127.0.0.1; reachable directly,
      # forwarded headers must not be trusted (spoofable client IP).
      OCW_TRUST_PROXY: ${OCW_TRUST_PROXY:-false}
      # Telemetry (`observability` profile): empty endpoint = the OpenTelemetry SDK never starts.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OCW_OTEL_ENDPOINT:-}
      OTEL_SERVICE_NAME: ocw-api
      # Secrets from OpenBao (`vault` profile): empty = env/file secrets only.
      OCW_OPENBAO_ADDR: ${OCW_OPENBAO_ADDR:-}
      OCW_OPENBAO_ROLE_ID: ${OCW_OPENBAO_ROLE_ID:-}
      OCW_OPENBAO_SECRET_ID: ${OCW_OPENBAO_SECRET_ID:-}
      OCW_OPENBAO_TOKEN: ${OCW_OPENBAO_TOKEN:-}
      # Sensitive-data scan of memory proposals (`pii` profile, MEM-05): empty URL = off; set it to
      # http://presidio:3000 together with COMPOSE_PROFILES=pii. Languages default to es,en; the deadline to 2000 ms.
      OCW_PRESIDIO_URL: ${OCW_PRESIDIO_URL:-}
      OCW_PRESIDIO_LANGUAGES: ${OCW_PRESIDIO_LANGUAGES:-}
      OCW_PRESIDIO_TIMEOUT_MS: ${OCW_PRESIDIO_TIMEOUT_MS:-}
      # Bot sandboxes (`sandbox` profile, 07.8): empty URL = off (Settings shows the service as down). With the profile,
      # OCW_SANDBOX_URL=http://sandboxd:8090; the token is generated by `pnpm ocw setup` and shared with sandboxd only.
      OCW_SANDBOX_URL: ${OCW_SANDBOX_URL:-}
      OCW_SANDBOX_TOKEN: ${OCW_SANDBOX_TOKEN:-}
    ports:
      - "${OCW_PUBLISH_ADDRESS:-0.0.0.0}:${OCW_API_PORT:-4000}:4000"
    # `pii` is internal and shared only with the Presidio sidecar (empty unless that profile runs); `sandbox-control`
    # is internal and shared only with sandboxd (empty unless the `sandbox` profile runs).
    networks:
      - default
      - pii
      - sandbox-control
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      garage:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: ocw-web:${OCW_IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      # Read at request time (not baked into the image).
      OCW_PUBLIC_API_URL: ${OCW_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "${OCW_PUBLISH_ADDRESS:-0.0.0.0}:${OCW_WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

  # OpenClaw cell (one per organization): bots run here and talk ONLY to the Agent Channel API.
  # The gateway/admin port binds loopback inside the container and is never published. Model provider
  # keys are not configured here: admins add them in Settings › Models and the cell receives them over
  # the authenticated Agent Channel. See infra/openclaw/README.md.
  openclaw:
    build:
      context: .
      dockerfile: infra/openclaw/Dockerfile
    image: ocw-openclaw:${OCW_IMAGE_TAG:-local}
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      OCW_API_URL: http://api:4000
      OCW_CELL_TOKEN_FILE: /run/secrets/ocw_cell_token
      # The gateway peaks around 1.1-1.2 GB RSS during a turn; cap the V8 heap.
      NODE_OPTIONS: ${OCW_CELL_NODE_OPTIONS:---max-old-space-size=512}
      # Same meaning as on the api service: which bundled search plugins load, and the SearXNG URL.
      OCW_SEARXNG_URL: ${OCW_SEARXNG_URL:-}
      OCW_BUNDLED_PLUGINS: ${OCW_BUNDLED_PLUGINS:-}
      OCW_CLAWHUB_URL: ${OCW_CLAWHUB_URL:-https://clawhub.ai}
    secrets:
      - ocw_cell_token
    volumes:
      - openclaw-state:/home/node/.openclaw
    # `mcp-sandbox` is internal and shared only with the stdio MCP sidecar (empty unless that profile runs).
    networks:
      - default
      - mcp-sandbox
    healthcheck:
      test: ["CMD", "node", "dist/docker-healthcheck.js"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 6
    depends_on:
      api:
        condition: service_healthy

  # Optional self-hosted meta-search for bots (D-09). Off by default; enable with
  #   OCW_SEARXNG_URL=http://searxng:8080 OCW_SEARXNG_SECRET=<random> docker compose --profile search up -d
  # then choose SearXNG in Settings › Bot policy. Reachable only on the compose network (no ports).
  searxng:
    profiles: ["search"]
    image: searxng/searxng:2026.10.4-d48c4b555@sha256:76b0bf285aca014c7191fc4d9234c4bfb358624ac33d8883833d496c059ec072
    restart: unless-stopped
    environment:
      # Required in practice: unset falls back to SearXNG's placeholder key, which SearXNG itself refuses to
      # start with ("server.secret_key is not changed"). A `:?` guard would break `docker compose config`
      # for everyone, because compose interpolates services of inactive profiles too.
      SEARXNG_SECRET: ${OCW_SEARXNG_SECRET:-ultrasecretkey}
    volumes:
      - ./infra/searxng/settings.yml:/etc/searxng/settings.yml:ro

  # Optional stdio MCP sandbox (D-13, infra/mcp-sandbox/README.md). Vetted, pinned stdio MCP servers baked into a
  # separate image run here, never inside the OpenClaw gateway container, and are exposed to the cell as remote
  # streamable-HTTP servers at http://mcp-sandbox:8080/<id>/mcp. Off by default; enable with
  #   OCW_MCP_SANDBOX_URL=http://mcp-sandbox:8080 OCW_MCP_SANDBOX_SERVERS=everything docker compose --profile mcp-sandbox up -d
  # No secrets, no volumes, no published ports, read-only root, no capabilities, and only an internal network shared
  # with the cell (no egress).
  mcp-sandbox:
    profiles: ["mcp-sandbox"]
    build:
      context: infra/mcp-sandbox
    image: ocw-mcp-sandbox:${OCW_IMAGE_TAG:-local}
    restart: unless-stopped
    init: true
    user: node
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    networks:
      - mcp-sandbox

  # Optional bot sandboxes and browser (Phase 07.8, D-01, D-11, ADR-0029). Off by default (D-12); enable with
  #   COMPOSE_PROFILES=sandbox and OCW_SANDBOX_URL=http://sandboxd:8090 in .env, then docker compose up -d --build --wait
  # and turn on Sandbox & Browser in Settings. sandboxd is the ONLY service with the Docker socket (root only for the
  # socket, no capability, read-only root), publishes no port and listens only on the internal `sandbox-control`
  # network, which only the API joins: the openclaw cell can never address it. It creates each bot's `sbx`, `brw` and
  # the namespace's `sandbox-egress` proxy itself, from the images below, labelled with OCW_SANDBOX_NAMESPACE (default:
  # this compose project). `docker compose down` does not remove those: `docker ps -a --filter
  # label=ocw.namespace=<project>` lists them (docs/INSTALL.md, "Bot sandboxes and browser").
  sandboxd:
    profiles: ["sandbox"]
    build:
      context: .
      dockerfile: infra/sandbox/sandboxd/Dockerfile
    image: ocw-sandboxd:${OCW_IMAGE_TAG:-local}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    environment:
      # No `:?` guard: compose interpolates inactive profiles too. sandboxd itself refuses a token under 32 characters.
      OCW_SANDBOX_TOKEN: ${OCW_SANDBOX_TOKEN:-}
      OCW_SANDBOX_NAMESPACE: ${OCW_SANDBOX_NAMESPACE:-${COMPOSE_PROJECT_NAME}}
      OCW_SANDBOXD_HOST: 0.0.0.0
      OCW_SANDBOXD_PORT: "8090"
      OCW_SANDBOX_RUNTIME: ${OCW_SANDBOX_RUNTIME:-auto}
      OCW_SANDBOX_SBX_IMAGE: ocw-sandbox-sbx:${OCW_IMAGE_TAG:-local}
      OCW_SANDBOX_BRW_IMAGE: ocw-sandbox-brw:${OCW_IMAGE_TAG:-local}
      OCW_SANDBOX_EGRESS_IMAGE: ocw-sandbox-egress:${OCW_IMAGE_TAG:-local}
      OCW_SANDBOX_BRW_SECCOMP: /app/brw-seccomp.json
      OCW_SANDBOXD_SWEEP_MS: ${OCW_SANDBOXD_SWEEP_MS:-60000}
      # Sandbox packages (07.8-17): the registries reviews and installs use; OCW_CLAWHUB_URL is the API's value.
      OCW_SANDBOX_NPM_REGISTRY: ${OCW_SANDBOX_NPM_REGISTRY:-https://registry.npmjs.org/}
      OCW_SANDBOX_PYPI_INDEX: ${OCW_SANDBOX_PYPI_INDEX:-https://pypi.org/simple/}
      OCW_CLAWHUB_URL: ${OCW_CLAWHUB_URL:-https://clawhub.ai}
      OCW_SANDBOX_REGISTRIES: ${OCW_SANDBOX_REGISTRIES:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - sandbox-control

  # Build-only services: compose builds the images sandboxd runs (`up --build`, `build`) and never starts them
  # (`scale: 0`). The tag follows OCW_IMAGE_TAG, so sandboxd's *_IMAGE variables above always name what was built.
  sandbox-sbx-image:
    profiles: ["sandbox"]
    build:
      context: infra/sandbox/sbx
    image: ocw-sandbox-sbx:${OCW_IMAGE_TAG:-local}
    scale: 0
    network_mode: none
  sandbox-brw-image:
    profiles: ["sandbox"]
    build:
      context: infra/sandbox/browser
    image: ocw-sandbox-brw:${OCW_IMAGE_TAG:-local}
    scale: 0
    network_mode: none
  sandbox-egress-image:
    profiles: ["sandbox"]
    build:
      context: .
      dockerfile: infra/sandbox/egress/Dockerfile
    image: ocw-sandbox-egress:${OCW_IMAGE_TAG:-local}
    scale: 0
    network_mode: none

networks:
  mcp-sandbox:
    internal: true
  # The API ↔ sandboxd control network (07.8, D-11): internal, exactly these two members (infra/compose.test.mjs).
  sandbox-control:
    internal: true

secrets:
  ocw_cell_token:
    environment: OCW_CELL_TOKEN

volumes:
  pgdata:
  openclaw-state:
  garage-meta:
  garage-data:
