# Releases. A vX.Y.Z tag builds the desktop app on macOS, Windows and Linux runners and publishes a GitHub release with
# the apps, the server installer and their SHA-256 checksums; the notes come from docs/releases/<tag>.md (else GitHub's
# generated notes). A tag with a suffix (v0.2.0-rc.1) is published as a pre-release, which `ocw upgrade` never picks by
# itself. The release stays a draft until every build is uploaded and SHA256SUMS covers them all.
# Pull requests touching the desktop app, the daemon or this file build the apps too, check their update manifests and
# run the update e2e (nothing is uploaded).
# No build is signed yet: macOS gets an ad-hoc signature (no Developer ID, no notarization) and Windows none (the
# release notes say how to open them).
# The build names every file with its release name and writes the update manifests (latest-mac.yml, latest.yml,
# latest-linux.yml) the desktop app's updater reads (07.13.1, D-03); this workflow uploads them unrenamed, with the mac
# zip and the blockmaps, so every manifest points at a file of the same release. A manifest check
# (apps/desktop/scripts/check-update-manifest.mjs: sha512, size, version, app-update.yml, on macOS the zip's seal) gates
# every runner, for pull requests and tags. Only a tag's build sets the release-build flag, the one build that may turn
# the updater on (D-02). Jobs that can write releases check out without persisting the token in .git/config. Turning on
# GitHub immutable releases (published assets can no longer be replaced) is the owner's repository setting.
# workflow_dispatch rebuilds and re-uploads an existing tag, only from v0.5.2 on: an older tag's electron-builder
# config has neither the release names nor the update manifests, so the collect and check steps would fail on it.
name: release

on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/local-runtime/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing release tag to rebuild and publish (vX.Y.Z)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}

jobs:
  # Opens the release as a draft (or reuses an existing one) and uploads the server installer.
  prepare:
    name: draft release
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check the tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "not a release tag: $TAG"; exit 1; }
      # Pinned to commit SHAs: these jobs can publish releases.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
          sparse-checkout: |
            docs/releases
            scripts/install.sh
            apps/local-runtime/package.json
            scripts/check-runtime-version.mjs
          sparse-checkout-cone-mode: false
      # The runtime's version follows the release (ADR-0040 § 13, D-10): a tag that disagrees publishes nothing.
      - name: Check the runtime version
        run: node scripts/check-runtime-version.mjs "$TAG"
      - name: Draft the release and upload install.sh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            args=(--draft --verify-tag --title "OCW $TAG")
            if [[ -f "docs/releases/$TAG.md" ]]; then args+=(--notes-file "docs/releases/$TAG.md"); else args+=(--generate-notes); fi
            if [[ "$TAG" == *-* ]]; then args+=(--prerelease); fi
            gh release create "$TAG" "${args[@]}"
          fi
          gh release upload "$TAG" scripts/install.sh --clobber

  desktop:
    name: desktop app (${{ matrix.name }})
    needs: prepare
    # Pull requests skip `prepare` and only build.
    if: ${{ !cancelled() && needs.prepare.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS arm64, os: macos-15, platform: macos-arm64 }
          - { name: Windows x64, os: windows-2025, platform: windows-x64 }
          - { name: Linux x64, os: ubuntu-24.04, platform: linux-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write # the upload step only; pull requests from forks get a read-only token anyway
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG && format('refs/tags/{0}', env.TAG) || github.ref }}
          # This job holds contents: write and runs install scripts; gh reads GH_TOKEN, never git's credentials.
          persist-credentials: false
          # .planning/ is most of the tree and no build reads it.
          sparse-checkout: |
            /*
            !/.planning/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: pnpm (corepack)
        run: corepack enable && pnpm --version
      - run: pnpm install --frozen-lockfile
      - name: App version from the tag
        if: env.TAG != ''
        working-directory: apps/desktop
        run: npm pkg set version="${TAG#v}"
      - name: Build the app
        env:
          # Only a release tag's build may turn the desktop updater on (D-02); pull requests build with it off.
          OCW_RELEASE_BUILD: ${{ env.TAG != '' && '1' || '0' }}
          # electron-builder skips signing on pull requests; the macOS build is only ever ad-hoc signed (identity "-",
          # no secret), so a pull request signs it too and the update manifest check sees the bundle a release ships.
          CSC_FOR_PULL_REQUEST: "true"
        run: pnpm --filter @ocw/desktop package
      - name: Check that the packaged daemon runs
        run: node apps/desktop/scripts/check-package.mjs
      # A tag checks against its own version; a pull request against the package's.
      - name: Check the update manifests
        run: |
          set -euo pipefail
          if [[ -n "$TAG" ]]; then
            node apps/desktop/scripts/check-update-manifest.mjs --version "${TAG#v}"
          else
            node apps/desktop/scripts/check-update-manifest.mjs
          fi
      # Ubuntu 24.04 restricts unprivileged user namespaces, which Chromium's sandbox needs (the fix doctor prints).
      - name: Allow Chromium's sandbox
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The update path end to end (07.13.1, D-12): the unpackaged app downloads from a loopback fake release served by
      # the test process itself, never GitHub, and never installs (apps/desktop/e2e/update.e2e.ts).
      - name: Update e2e (offline fake release)
        run: |
          set -euo pipefail
          display=""
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            command -v xvfb-run >/dev/null || { sudo apt-get update -q && sudo apt-get install -yq xvfb; }
            display="xvfb-run -a"
          fi
          $display pnpm --filter @ocw/desktop test:update
      # The files exactly as built: the manifests name them, so a rename would break every update. An unmatched
      # pattern stays literal and `cp` fails the step.
      - name: Collect the release files
        run: |
          set -euo pipefail
          mkdir -p out
          cd apps/desktop/release
          case "${{ matrix.platform }}" in
            macos-arm64)
              files=(OCW-v*-macos-arm64.dmg OCW-v*-macos-arm64.zip OCW-v*-macos-arm64.zip.blockmap latest-mac.yml) ;;
            windows-x64)
              files=(OCW-v*-windows-x64-setup.exe OCW-v*-windows-x64-setup.exe.blockmap latest.yml) ;;
            linux-x64)
              files=(OCW-v*-linux-x86_64.AppImage OCW-v*-linux-amd64.deb latest-linux.yml) ;;
          esac
          cp -- "${files[@]}" ../../../out/
          ls -l ../../../out
      # No workflow artifact: on a public repository it would be a second, unreviewed download channel. A pull request
      # only proves the apps build and their daemon runs; a tag publishes them through the draft release.
      - name: Upload to the draft release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" out/* --clobber

  # Checksums over everything uploaded, then the draft goes public.
  publish:
    name: publish release
    needs: desktop
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: SHA256SUMS and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir files && cd files
          gh release download "$TAG" --pattern 'OCW-*' --pattern 'latest*.yml' --pattern 'install.sh'
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber
          if [[ "$TAG" == *-* ]]; then
            gh release edit "$TAG" --draft=false --prerelease
          else
            gh release edit "$TAG" --draft=false --latest
          fi
