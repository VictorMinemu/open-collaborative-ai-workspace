# Repository-local Semgrep rules run by `pnpm guard` (scripts/guard/run.mjs) inside `pnpm verify` (D-08, FOUND-07).
# Each rule refuses a change that weakens the platform's policy. An allowlist entry names one exact file (or the one
# directory ADR-0012 designates) and, for tests, only tests that assert the denial. Never loosen a pattern instead.
# Path patterns start with "/" so they are anchored at the repository root. Fixtures: .semgrep/tests/ (--rule-tests).
rules:
  - id: ocw.permission-bypass-token
    languages: [generic]
    severity: ERROR
    message: >-
      A runtime permission-bypass mode appears outside the ADR-0012 path. Full access is enabled only through
      org policy ∩ device opt-in ∩ grain, server-checked and audited (docs/adr/0012-full-access-mode-and-shared-devices.md).
    pattern-regex: (bypassPermissions|danger-full-access|allowDangerouslySkipPermissions|dangerously-skip-permissions|dangerouslySkipPermissions)
    paths:
      exclude:
        # The ADR-0012 path: runtime adapters, the fixture recorder and the contracts that name the modes.
        - /apps/local-runtime/src/claude/
        - /apps/local-runtime/src/codex/
        - /apps/local-runtime/scripts/record-fixture.ts
        - /packages/contracts/src/runtime-controls/
        - /packages/contracts/src/session-events.ts
        - /packages/contracts/src/device-link.ts
        # Tests that assert the bypass is refused.
        - /apps/api/src/modules/work-session/turn-mode.int.test.ts
        - /apps/local-runtime/src/daemon.test.ts
        - /packages/contracts/src/session-settings.test.ts
        - /packages/contracts/src/slash-commands.test.ts
        - /packages/db/src/rls-isolation.int.test.ts

  - id: ocw.rls-bypass
    languages: [generic]
    severity: ERROR
    message: >-
      Row level security is bypassed, disabled or no longer forced. Only packages/db/sql/bootstrap.sql grants the
      migrator role its bypass; ocw_app always runs with RLS enforced (ADR-0003). SQL "--" comment lines are ignored.
    # Case-insensitive; a "--" comment line never matches; \b keeps NOBYPASSRLS and rolbypassrls out.
    pattern-regex: (?im)^(?![ \t]*--).*?\b(BYPASSRLS|DISABLE\s+ROW\s+LEVEL\s+SECURITY|NO\s+FORCE\s+ROW\s+LEVEL\s+SECURITY)\b
    paths:
      exclude:
        - /packages/db/sql/bootstrap.sql
        # Asserts the app role is neither superuser nor bypasses RLS.
        - /packages/db/src/rls-isolation.int.test.ts

  - id: ocw.skipped-policy-test
    languages: [typescript]
    severity: ERROR
    message: >-
      A policy test is skipped or left as a todo. Tests that prove permissions, RLS and tenant isolation never skip;
      fix the test or the code instead (FOUND-07, PITFALLS 13).
    pattern-either:
      - pattern: $X.skip(...)
      - pattern: $X.todo(...)
      - pattern: $X.skipIf(...)(...)
      - pattern: $X.runIf(...)(...)
      - pattern: xit(...)
      - pattern: xdescribe(...)
      - pattern: xtest(...)
    paths:
      # Every API and package test: tenant-isolation and permission cases live in most modules (search, ai-chat,
      # chat, work-session…), so a name list always misses some (07 verification gap).
      include:
        - /apps/api/src/**/*.test.ts
        - /packages/*/src/**/*.test.ts
        - /apps/local-runtime/src/codex/mode-policy.test.ts

  - id: ocw.focused-test
    languages: [typescript]
    severity: ERROR
    message: >-
      A focused test (.only) silently narrows `pnpm test` to one test. Remove .only before committing.
    pattern-either:
      - pattern: $X.only(...)
      - pattern: $X.only.$Y(...)(...)
    paths:
      include:
        - /apps/
        - /packages/
        - /e2e/

  - id: ocw.ai-telemetry-records-prompts
    languages: [typescript]
    severity: ERROR
    message: >-
      AI SDK telemetry records prompts and outputs by default. Set `recordInputs: false` and `recordOutputs: false`
      inline (or `isEnabled: false`); prompt contents never leave the API in spans (D-05, D-18).
    patterns:
      - pattern-either:
          - pattern: "{..., experimental_telemetry: $T, ...}"
          - patterns:
              - pattern: "{..., telemetry: $T, ...}"
              - pattern-either:
                  - pattern-inside: $FN({...})
                  - pattern-inside: new $FN({...})
              - metavariable-regex:
                  metavariable: $FN
                  regex: ^(generateText|streamText|generateObject|streamObject|embed|embedMany|rerank|Experimental_Agent|ToolLoopAgent|Agent)$
      - pattern-not: "{..., experimental_telemetry: {..., isEnabled: false, ...}, ...}"
      - pattern-not: "{..., experimental_telemetry: {..., recordInputs: false, ..., recordOutputs: false, ...}, ...}"
      - pattern-not: "{..., telemetry: {..., isEnabled: false, ...}, ...}"
      - pattern-not: "{..., telemetry: {..., recordInputs: false, ..., recordOutputs: false, ...}, ...}"

  - id: ocw.raw-egress
    languages: [typescript]
    severity: ERROR
    message: >-
      Outbound calls go through lib/egress.ts (ADR-0025): the connectors and keychain modules and the Agent Channel
      proxy routes call admin-, authorization-server- and model-chosen URLs, so a raw fetch, undici, http(s), tls or
      socket call would skip the public-only, IP-pinned egress guard (D-07, CONN-05). Use egressFor(env). In the
      sandbox egress entrypoint (07.8 D-11) only proxy.ts opens sockets, after deciding with @ocw/egress-policy.
    pattern-either:
      - pattern: fetch(...)
      - pattern: globalThis.fetch(...)
      - pattern: global.fetch(...)
      - pattern: window.fetch(...)
      - pattern: new WebSocket(...)
      - pattern: new EventSource(...)
      # Imports, requires and dynamic imports of the raw network clients.
      - pattern-regex: (?:from|import|require\()\s*\(?\s*["'](?:undici|(?:node:)?(?:http|https|http2|tls|dgram))["']
      # node:net is fine for isIP/BlockList; connecting through it is not.
      - pattern-regex: \bimport\s+(?:\*\s+as\s+)?\w+\s+from\s*["'](?:node:)?net["']
      - pattern-regex: \bimport\s*\{[^}]*\b(?:connect|createConnection|Socket)\b[^}]*\}\s*from\s*["'](?:node:)?net["']
    paths:
      include:
        - /apps/api/src/modules/connectors/
        - /apps/api/src/modules/keychain/
        - /apps/api/src/modules/agent-channel/connectors.ts
        - /apps/api/src/modules/agent-channel/http-requests.ts
        - /apps/sandboxd/src/egress/
      exclude:
        - "*.test.ts"
        # ADR-0029 (07.8-12): the sandbox-egress proxy is the one place that connects for a bot, to the address it
        # pinned after deciding every answer with the shared 07.4 rules.
        - /apps/sandboxd/src/egress/proxy.ts

  - id: ocw.raw-auth-mode
    languages: [typescript]
    severity: ERROR
    message: >-
      A raw comparison against the organization-headers auth mode reads every other mode as one kind, so a new mode
      (organization sign-in, client credentials) is silently treated as a member's account or rendered in the cell
      (ADR-0036, 07.14 D-16). Ask the question with a predicate from @ocw/contracts connectors.ts: rendersInCell,
      usesConnectorProxy, isPerMemberMode, isOrgCredentialMode or usesOAuthSignIn; in SQL use
      inArray(mcpServers.authMode, CELL_MODES | CONNECTOR_PROXY_MODES | PER_MEMBER_MODES | ORG_CREDENTIAL_MODES).
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: $X === "$MODE"
                  - pattern: '"$MODE" === $X'
                  - pattern: $X !== "$MODE"
                  - pattern: '"$MODE" !== $X'
                  # 07.14 review IN-03: the loose operators and list membership ask the same raw question.
                  - pattern: $X == "$MODE"
                  - pattern: '"$MODE" == $X'
                  - pattern: $X != "$MODE"
                  - pattern: '"$MODE" != $X'
                  - pattern: eq($COLUMN, "$MODE")
                  - pattern: ne($COLUMN, "$MODE")
                  - pattern: '[..., "$MODE", ...].includes($X)'
                  - pattern: 'inArray($COLUMN, [..., "$MODE", ...])'
                  - pattern: 'notInArray($COLUMN, [..., "$MODE", ...])'
              - metavariable-regex:
                  metavariable: $MODE
                  regex: ^org_secret$
          # A switch case (IN-03): Semgrep's TypeScript patterns cannot name one case of a switch, so a regex does.
          - pattern-regex: '\bcase\s+["''`]org_secret["''`]\s*:'
      # Semgrep 1.178 derives no prefilter from string literals or a metavariable-regex, so without this conjunct it
      # parses every target as TypeScript and breaks the SQL fixture's rule test (rules.sql). The regex lets it skip
      # files that never name the mode.
      - pattern-regex: org_secret
    paths:
      # packages/contracts/src/connectors.ts holds the predicates themselves: the one place a raw comparison lives.
      include:
        - /apps/
        - /packages/
      exclude:
        - /packages/contracts/src/connectors.ts
        - "*.test.ts"
        - "*.test.tsx"
        - "*.spec.ts"

  - id: ocw.live-input-logging
    languages: [typescript]
    severity: ERROR
    message: >-
      What a person types while controlling a bot's browser is never logged (07.8 D-07, P-10, ADR-0029): a live input
      frame, a live client frame, a sandboxd input batch, their `text`, `key`, `events` or `inputs` fields, or the web's
      DOM input (`data`, `value`, `clipboardData`) must not reach a logger. Log the context id and an error name only.
    patterns:
      - pattern-either:
          - patterns:
              - pattern-inside: $LOG.$LEVEL(...)
              - metavariable-regex:
                  metavariable: $LEVEL
                  regex: ^(trace|debug|info|warn|error|fatal|log)$
          # 07.8 hardening: sandboxd's own log writers (its `log` option, the browser broker's brw lifecycle and agent
          # diagnostics lines).
          - patterns:
              - pattern-inside: $FN(...)
              - metavariable-regex:
                  metavariable: $FN
                  regex: ^(log|writeLog|brwLog)$
      - pattern-either:
          # A value declared as a live input frame, a client frame or an input batch (parameter or binding). Typed
          # metavariables (`($F: LiveInputFrame)`) are avoided: they break the SQL fixture's rule test (semgrep 1.178).
          - patterns:
              - pattern-either:
                  - pattern-inside: "function $FN(..., $F: $T, ...) { ... }"
                  - pattern-inside: "($F: $T, ...) => { ... }"
                  - pattern-inside: "(..., $F: $T) => { ... }"
                  - pattern-inside: |
                      const $F: $T = $E;
                      ...
                  - pattern-inside: |
                      let $F: $T = $E;
                      ...
              - metavariable-regex:
                  metavariable: $T
                  regex: ^(LiveInputFrame|LiveClientFrame|SandboxdContextInput)(\[\])?$
              - pattern: $F
          - pattern: "{..., text, ...}"
          - pattern: "{..., key, ...}"
          - pattern: "{..., events, ...}"
          - pattern: $X.text
          - pattern: $X.key
          - pattern: $X.events
          - pattern: $X.inputs
          # 07.8-26: the web's DOM input itself (an InputEvent's or CompositionEvent's `data`, the phone keyboard
          # input's `value`, a paste's `clipboardData`), before it becomes a frame.
          - pattern: $X.data
          - pattern: $X.value
          - pattern: $X.clipboardData
    paths:
      # Where live input is handled: the API's live view and takeover, the bots' browser routes, sandboxd's browser
      # broker, its agent link and its HTTP server. Fixture: .semgrep/tests/live-input-logging.ts.
      include:
        - /apps/api/src/modules/browser/
        - /apps/api/src/modules/agent-channel/browser.ts
        - /apps/sandboxd/src/browser.ts
        - /apps/sandboxd/src/agent-link.ts
        - /apps/sandboxd/src/server.ts
        # 07.8-22: the web live view (the input mappers, the socket and the frame that captures the keyboard).
        - /apps/web/components/browser/
      exclude:
        - "*.test.ts"
        - "*.test.tsx"
