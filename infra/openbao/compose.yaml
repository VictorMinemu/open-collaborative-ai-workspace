# Profile `vault`: OpenBao for the API-only secrets (SELF-02, D-04, D-16). Included by compose.yaml; its services
# start only when COMPOSE_PROFILES names `vault`. Enable it on an existing install, without reinstalling, with
#   pnpm ocw enable vault
# which generates the static seal key, initialises OpenBao, moves BETTER_AUTH_SECRET, OCW_ENCRYPTION_KEY,
# OCW_SETUP_TOKEN and OCW_SMTP_URL into KV (secret/ocw/api) and leaves openbao:// references in .env
# (docs/self-hosting/secrets.md). Server mode, never dev mode; no published port; no default credential.
services:
  openbao:
    profiles: ["vault"]
    image: openbao/openbao:2.7.1@sha256:6d2b93856e3fcf7b18ad855a0b51eaba474dc8b79cf554379ea32034797d2acf
    restart: unless-stopped
    # Starts as root only to copy the seal key (mode 0600 on the host, whatever its owner) into a tmpfs readable by
    # the openbao user; the image's entrypoint then drops to openbao before it starts the server.
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -c
      - >-
        if [ ! -s /run/secrets/openbao_seal_key ]; then
        echo "openbao: OCW_OPENBAO_SEAL_KEY_FILE is not set or empty (run pnpm ocw enable vault)" >&2; exit 1; fi;
        chown openbao:openbao /run/openbao &&
        install -m 0400 -o openbao -g openbao /run/secrets/openbao_seal_key /run/openbao/seal.key &&
        exec docker-entrypoint.sh server
    environment:
      # For `bao` inside the container (ocw enable vault runs it through docker compose exec).
      BAO_ADDR: http://127.0.0.1:8200
    volumes:
      - ./openbao.hcl:/openbao/config/openbao.hcl:ro
      - openbao-data:/openbao/file
      - ${OCW_OPENBAO_SEAL_KEY_FILE:-/dev/null}:/run/secrets/openbao_seal_key:ro
    tmpfs:
      - /run/openbao:mode=0700,size=1m
    cap_drop: [ALL]
    # Read the 0600 key (DAC_OVERRIDE), hand the copy to openbao (CHOWN, then FOWNER to set its mode) and drop to that
    # user (SETUID, SETGID). The server itself runs as openbao with no capabilities.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    security_opt:
      - no-new-privileges:true
    # 200 only when initialised, unsealed and active: a sealed OpenBao is unhealthy.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 30

volumes:
  openbao-data:
