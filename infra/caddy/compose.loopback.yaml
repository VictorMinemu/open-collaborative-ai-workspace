# Optional override for the `proxy` profile: publish Caddy on 127.0.0.1 only. Gate stacks use it (they are never
# reachable from the network, D-11); an operator can use it when another front end on the same host (a tunnel, a
# load balancer agent) forwards to Caddy. Add it after compose.yaml in COMPOSE_FILE, e.g.
#   COMPOSE_FILE=compose.yaml:infra/caddy/compose.loopback.yaml
# Without it, compose.yaml's include publishes Caddy on every interface, IPv4 and IPv6.
services:
  caddy:
    ports: !override
      - "127.0.0.1:${OCW_PROXY_HTTP_PORT:-80}:80"
      - "127.0.0.1:${OCW_PROXY_HTTPS_PORT:-443}:443"
      - "127.0.0.1:${OCW_PROXY_HTTPS_PORT:-443}:443/udp"
