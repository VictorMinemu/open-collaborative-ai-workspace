# Profile `observability` (FOUND-05, D-05): OpenTelemetry Collector, Tempo, Prometheus, Loki and Grafana, all
# self-hosted and pinned by digest. Included by compose.yaml; nothing here starts until COMPOSE_PROFILES names
# `observability`. Turn it on for a running install with `pnpm ocw enable observability`: it sets
# OCW_OTEL_ENDPOINT=http://otel-collector:4318 (compose.yaml passes it to the api as OTEL_EXPORTER_OTLP_ENDPOINT) and
# OCW_GRAFANA_ADMIN_PASSWORD, then `docker compose up -d --wait` recreates only the api and starts these services.
# Only Grafana is published, on 127.0.0.1; the backends listen on the compose network only. Telemetry is not part of
# `ocw backup` (docs/self-hosting/observability.md).
services:
  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:0.161.0@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1
    restart: unless-stopped
    command: ["--config", "/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    # The config's memory_limiter (200 MiB) keeps it under this.
    mem_limit: 256m
    depends_on:
      - tempo
      - prometheus
      - loki

  tempo:
    profiles: ["observability"]
    image: grafana/tempo:3.1.0@sha256:3076b8dcdfb32fd6bc5ccef85e7b7313e6199b9cb84366257fc17ecb696db5fd
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.13.4@sha256:87861b8cf91579109319ebc300f3f1060e6da9c05d6ae8ad15a20c879e84e32e
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-otlp-receiver
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 12

  loki:
    profiles: ["observability"]
    image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    restart: unless-stopped
    # Never the default admin password (D-13, T-07-07-02). A `:?` guard would break `docker compose config` for every
    # install without the profile, so the refusal lives here and names the env key to set.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        case "$${GF_SECURITY_ADMIN_PASSWORD}" in
        ""|admin) echo "OCW_GRAFANA_ADMIN_PASSWORD is empty or the default: run pnpm ocw enable observability (it generates one)." >&2; exit 1;;
        esac;
        exec /run.sh
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${OCW_GRAFANA_ADMIN_PASSWORD:-}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://127.0.0.1:${OCW_GRAFANA_PORT:-3301}/
      # Self-hosted: no usage reports, update checks, news feed or plugin downloads at start.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ./grafana/datasources.yaml:/etc/grafana/provisioning/datasources/ocw.yaml:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${OCW_GRAFANA_PORT:-3301}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 12
    depends_on:
      - prometheus
      - loki
      - tempo

volumes:
  tempo-data:
  prometheus-data:
  loki-data:
  grafana-data:
