# Tempo 3.x monolithic (`observability` profile): traces from the collector over OTLP gRPC, local storage on the
# tempo-data volume, no Kafka. Tempo 3 removed the ingester/compactor blocks; the defaults keep traces 14 days
# (backend_worker.compaction.block_retention = 336h). Queried by Grafana on tempo:3200; never published.
stream_over_http_enabled: true
server:
  http_listen_port: 3200
  log_level: warn
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
# Self-hosted: no anonymous usage report to Grafana Labs.
usage_report:
  reporting_enabled: false
