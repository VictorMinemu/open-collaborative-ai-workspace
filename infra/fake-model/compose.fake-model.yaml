# E2E-only additions — snippet for the integrator to merge into compose.e2e.yaml.
#   docker compose -f compose.yaml -f compose.e2e.yaml up -d --build --wait
#
# - fake-model: deterministic OpenAI/Anthropic-compatible LLM on :18999 (/v1), no deps, never
#   metered. It is the API's `fake` provider (OCW_MODEL_PROVIDER=mock → bots use `fake/mock-1`,
#   base URL OCW_MOCK_MODEL_BASE_URL, default http://fake-model:18999/v1). Its reply is computed from
#   the structured identity OpenClaw puts in the prompt, e.g.
#   "Hi Víctor Ruiz! (participants: Alex, Víctor Ruiz) [asker id: <uuid>] [tools: 0]"
# - openclaw: only on an internal network (no internet egress), so a misconfiguration can never
#   reach a metered provider.
services:
  fake-model:
    build:
      context: .
      dockerfile: infra/fake-model/Dockerfile
    image: ocw-fake-model:local
    environment:
      FAKE_MODEL_IDS: mock-1,mock-2
    networks:
      - ocw-internal

  openclaw:
    networks: !override
      - ocw-internal
    depends_on:
      fake-model:
        condition: service_healthy

  # The API must also be reachable on the internal network (it keeps its default network too).
  api:
    environment:
      OCW_MODEL_PROVIDER: mock
      OCW_MOCK_MODEL_BASE_URL: http://fake-model:18999/v1
    networks:
      - default
      - ocw-internal

networks:
  ocw-internal:
    internal: true
    # Hosts with many compose projects can exhaust Docker's default pools; pin a subnet if needed:
    # ipam:
    #   config:
    #     - subnet: 10.231.78.0/24
