name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Security issues go through SECURITY.md, never here.**
        Never paste secrets, `.env` contents, tokens or private company data.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. See …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Install / upgrade / operations
        - Chat (channels, threads, DMs, search)
        - AI chats
        - Bots (OpenClaw, cards, memory, approvals, automations)
        - Work Zone (desktop app, local runtime, headless server)
        - Settings / permissions / admin
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The commit or tag (`git -C /opt/ocw rev-parse --short HEAD`).
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Server OS, Docker and Compose versions, browser or desktop OS, and whether the proxy, vault or sandbox profiles are on.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines from `docker compose logs <service>`. Check them for secrets before pasting.
      render: text
