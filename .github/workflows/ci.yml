name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify (lint, typecheck, unit + integration)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Enable pnpm (packageManager pin)
        run: corepack enable && pnpm --version
      - run: pnpm install --frozen-lockfile
      # Integration tests start real PostgreSQL 18 / Redis 8 / Garage containers (testcontainers).
      - run: pnpm verify
      # setup-env (Garage/S3 keys, --add-missing); infra/**/*.test.mjs (incl. infra/garage) run in cell-smoke.
      - name: Script tests
        run: node --test 'scripts/**/*.test.mjs'
      - name: Package suites (daemon, desktop)
        run: |
          pnpm --filter @ocw/local-runtime test
          pnpm --filter @ocw/desktop test

  e2e:
    # Runs alongside verify (no `needs`), one job per viewport, each on its own fresh stack.
    name: e2e (Playwright, ${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile]
    env:
      # Bots use the deterministic mock model; CI never receives a metered model key.
      OCW_MODEL_PROVIDER: mock
      # Specs sign many browsers in from one IP; production keeps the default 30/min.
      OCW_SIGNIN_RATE_LIMIT_PER_MINUTE: "600"
      # Marketplace / MCP specs: the API proxies the fake ClawHub, the simulated cell probes the fake MCP.
      OCW_CLAWHUB_URL: http://127.0.0.1:4291
      OCW_E2E_FAKE_URL: http://127.0.0.1:4291
      OCW_E2E_FAKE_MCP_TOKEN: e2e-mcp-token
      # Per-member connectors (07.4): the fake OAuth MCP server's registered name; test-only, refused in production.
      OCW_EGRESS_TEST_HOSTS: fake-mcp=127.0.0.1
      # Bot sandboxes (07.8, as scripts/e2e-isolated.sh and .woodpecker/e2e.yaml): the API's broker is the fake sandboxd
      # the fake server mounts at /__sandboxd behind this fixed, loopback-only test token.
      OCW_SANDBOX_URL: http://127.0.0.1:4291/__sandboxd
      OCW_SANDBOX_TOKEN: e2e-sandbox-token-0123456789abcdef0123456789
      OCW_E2E_SANDBOX: fake
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # Garage (attachments, ADR-0015) comes from compose with the keys setup:env generated; the API runs on the host
      # and reaches it on 127.0.0.1:3900 (OCW_S3_ENDPOINT in .env), browsers on localhost:3900 (OCW_S3_PUBLIC_URL).
      - name: Environment, database and object storage
        run: |
          pnpm setup:env
          docker compose up -d --wait postgres redis garage
          pnpm db:migrate
      - name: Fake model, MCP, ClawHub and sandboxd (loopback, no internet)
        run: |
          (PORT=4291 FAKE_MODEL_HOST=127.0.0.1 FAKE_MCP_TOKEN=e2e-mcp-token FAKE_SANDBOX_TOKEN=$OCW_SANDBOX_TOKEN FAKE_MCP_OAUTH_REDIRECTS=http://localhost:4000/api/v1/connectors/oauth/callback,http://127.0.0.1:4000/api/v1/connectors/oauth/callback nohup node infra/fake-model/server.mjs > fake.log 2>&1 &)
          for i in $(seq 1 20); do curl -sf -o /dev/null localhost:4291/v1/models && break; sleep 1; done
      - name: Start API and web
        run: |
          (cd apps/api && nohup node --env-file-if-exists=../../.env --import tsx src/main.ts > ../../api.log 2>&1 &)
          (cd apps/web && pnpm build && nohup node --env-file-if-exists=../../.env ./node_modules/next/dist/bin/next start -p 3000 > ../../web.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf localhost:4000/health && curl -sf -o /dev/null localhost:3000/login && break; sleep 2; done
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # Bounded on its own: the system packages come from the runner's apt mirror, and one slow mirror (32 MB in
      # 26 min) once ate the whole job budget, so the job was cancelled two seconds into the 22nd test and looked
      # like a hung codex-subscription spec. A timed-out step fails (and keeps the failure artifacts); a cancelled
      # job does not.
      - name: Chromium and its system packages
        timeout-minutes: 8
        run: pnpm exec playwright install --with-deps chromium
      # globalTimeout is 15 minutes in CI (e2e/playwright.config.ts); this only backs it up. Setup (~2) + 8 + 17 < 30.
      - name: Playwright
        timeout-minutes: 17
        run: pnpm e2e --project=${{ matrix.project }}
      - name: Realtime latency report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.project == 'desktop' && 'realtime-latency' || 'realtime-latency-mobile' }}
          path: e2e/test-results/realtime-latency.json
          if-no-files-found: warn
          retention-days: 30
      - name: Logs and report on failure
        if: failure()
        run: |
          tail -n 200 api.log web.log fake.log || true
          docker compose logs --tail 50 garage || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  images:
    name: docker images (api, web, openclaw cell)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      # The OpenClaw base image is ~5 GB unpacked; make room on the hosted runner first.
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - run: docker build -f apps/api/Dockerfile -t ocw-api:ci .
      - run: docker build -f apps/web/Dockerfile -t ocw-web:ci .
      # The shipped cell image with the bundled search plugins (pinned + sha512-checked at build time).
      - run: docker build -f infra/openclaw/Dockerfile -t ocw-openclaw:ci .
      # Bot sandboxes (07.8-24): the broker and the three images it runs, as the `sandbox` compose profile builds them.
      - run: docker build -f infra/sandbox/sandboxd/Dockerfile -t ocw-sandboxd:ci .
      - run: docker build -t ocw-sandbox-sbx:ci infra/sandbox/sbx
      - run: docker build -t ocw-sandbox-brw:ci infra/sandbox/browser
      - run: docker build -f infra/sandbox/egress/Dockerfile -t ocw-sandbox-egress:ci .

  cell-smoke:
    name: openclaw cell smoke (real container, offline)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: Stdio MCP sandbox dependencies (locked, no lifecycle scripts)
        run: npm ci --prefix infra/mcp-sandbox --ignore-scripts --no-audit --no-fund
      - name: Renderer and fake model unit tests
        run: node --test 'infra/**/*.test.mjs'
      - name: Build the plugin
        run: pnpm --filter @ocw/openclaw-channel build
      # Real OpenClaw 2026.9.7 cell (image built here from infra/openclaw/Dockerfile) + the working-tree
      # plugin + fake model + fake Agent Channel API on an egress-less network: no real model, no real web.
      - name: Container smoke (all scenarios)
        run: SMOKE_BUILD=1 bash infra/openclaw/test/run-container-smoke.sh

  sandbox:
    # Mirror of .woodpecker/sandbox.yaml's runc smokes (07.8-24): real Docker, hardened runc, every object removed by
    # its label. The gVisor job and the real-stack proof run in Woodpecker only (nested runsc daemon, real cell).
    name: bot sandbox smokes (real Docker, runc)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - run: bash infra/sandbox/test/run-sandbox-smoke.sh
      - run: bash infra/sandbox/test/run-egress-smoke.sh
      - run: bash infra/sandbox/test/run-browser-smoke.sh
      - run: bash infra/sandbox/test/run-stack-smoke.sh
      - run: bash infra/sandbox/test/run-packages-smoke.sh
