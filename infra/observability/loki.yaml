# Loki single binary of the `observability` profile: logs arrive by native OTLP from the collector (POST /otlp/v1/logs),
# stored on the loki-data volume, kept 15 days. trace_id/span_id become structured metadata (Grafana links them to
# Tempo). Queried by Grafana on loki:3100; never published.
auth_enabled: false
server:
  http_listen_port: 3100
  log_level: warn
common:
  path_prefix: /loki
  instance_addr: 127.0.0.1
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
limits_config:
  allow_structured_metadata: true
  retention_period: 360h
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
# Self-hosted: no anonymous usage report to Grafana Labs.
analytics:
  reporting_enabled: false
