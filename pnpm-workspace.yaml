packages:
  - apps/*
  - packages/*

# Exact versions only; never pull a version younger than 7 days (supply-chain hygiene, see 01-RESEARCH.md).
saveExact: true
minimumReleaseAge: 10080
engineStrict: true

# Lifecycle scripts are blocked by default; allow only what the stack needs.
allowBuilds:
  esbuild: true
  sharp: true
  "@biomejs/biome": true
  protobufjs: true
  cpu-features: false
  ssh2: false
  electron: true
  # Windows-only installer helper pulled by electron-builder; its postinstall is not needed on macOS/Linux.
  electron-winstaller: false

# The package manager itself is pinned via packageManager and reviewed separately.
minimumReleaseAgeExclude:
  - pnpm
  - "@pnpm/exe.*"
  # apps/local-runtime was merged without a lockfile update; these exact pins were < 7 days old on
  # 2026-10-02 and block every install. Remove each entry once it has matured (after 2026-10-09).
  - "@anthropic-ai/claude-agent-sdk@0.3.287"
  - "@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.287"
  - "@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.287"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.287"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.287"
  - "@anthropic-ai/claude-agent-sdk-linux-x64@0.3.287"
  - "@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.287"
  - "@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.287"
  - "@anthropic-ai/claude-agent-sdk-win32-x64@0.3.287"
  - "@anthropic-ai/sdk@0.131.0"
  - "@modelcontextprotocol/sdk@1.32.0"
  - "@vitest/mocker@5.0.3"
  - "@vitest/spy@5.0.3"
  - vitest@5.0.3
  - ws@8.22.0
